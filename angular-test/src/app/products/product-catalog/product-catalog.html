<section class="mx-auto max-w-6xl px-4 py-8">
  <h1 class="mb-6 text-2xl font-semibold text-gray-900">Catálogo de productos</h1>

  <app-product-filter [value]="searchTerm()" (searchChange)="onSearchChange($event)" />

  @if (loading()) {
    <p class="mt-10 text-center text-sm text-gray-500">Buscando...</p>
  } @else if (products().length) {
    <div class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      @for (product of products(); track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  } @else {
    <p class="mt-10 text-center text-sm text-gray-500">No se encontraron productos.</p>
  }
</section>
