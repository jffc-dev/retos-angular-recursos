 <nav class="mt-8 flex items-center justify-center gap-2" aria-label="Paginación">
    <button
      type="button"
      class="rounded-md border border-gray-300 px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="pagina() === 1"
      (click)="1"
    >
      Anterior
    </button>

    @for (p of listaPaginas(); track p) {
      <button
        type="button"
        class="h-9 w-9 rounded-md border text-sm font-medium transition-colors"
        [class]="
          pagina() === p
            ? 'border-blue-500 bg-blue-500 text-white'
            : 'border-gray-300 text-gray-700 hover:bg-gray-100'
        "
        (click)="1"
      >
        {{ p }}
      </button>
    }

    <button
      type="button"
      class="rounded-md border border-gray-300 px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="pagina() >= totalPaginas()"
      (click)="1"
    >
      Siguiente
    </button>
  </nav>
